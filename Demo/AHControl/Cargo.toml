[package]
name = "AHControl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrow_convert = "0.9.0"
chrono = "0.4.42"
clap = { version = "4.5.40", features = ["derive"] }
dora-node-api = "0.3.11"
eyre = "0.6.12"
facet = "0.27.14"
facet-pretty = "0.23.21"
facet-toml = "0.25.15"
getrandom = "0.3.4"
rustypot = "1.1.0"
serialport = "4.7.2"
toml = "0.8.23"
log = "0.4.17"
paste = "1.0.10"
proc-macro2 = { version = "1.0", features=["default", "proc-macro"] }
